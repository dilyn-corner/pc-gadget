volumes:
  pc:
    schema: gpt
    # bootloader configuration is shipped and managed by snapd
    bootloader: grub
    structure:
      - name: mbr
        type: mbr
        size: 440
        update:
          edition: 1
        # This mbr simply writes an error to the console, as this
        # gadget supports gpt only
        content:
          - image: mbr.img
        # This one should be removed if we find a way to allow updates
        # without keeping all partitions.
      - name: BIOS Boot
        type: 21686148-6449-6E6F-744E-656564454649
        size: 1M
        offset: 1M
        update:
          edition: 2
      - name: ubuntu-seed
        role: system-seed
        filesystem: vfat
        # UEFI will boot the ESP partition by default first
        type: C12A7328-F81F-11D2-BA4B-00A0C93EC93B
        # It isn't obvious how big the seed might be, but we have plenty of disk
        # space to work with on the target that this is a reasonable default.
        size: 1200M
        update:
          edition: 3
        content:
          - source: grubx64.efi
            target: EFI/ubuntu/grubx64.efi
          - source: shim.efi.signed
            target: EFI/ubuntu/shimx64.efi
          - source: boot.csv
            target: EFI/ubuntu/bootx64.csv
          - source: fb.efi
            target: EFI/boot/fbx64.efi
          - source: shim.efi.signed
            target: EFI/boot/bootx64.efi
      - name: ubuntu-boot
        role: system-boot
        filesystem: ext4
        type: 0FC63DAF-8483-4772-8E79-3D69D8477DE4
        # This is more than enough space for the size of the kernels we
        # anticipate having on disk.
        size: 750M
        update:
          edition: 1
        content:
          - source: grubx64.efi
            target: EFI/boot/grubx64.efi
      - name: ubuntu-save
        role: system-save
        filesystem: ext4
        type: 0FC63DAF-8483-4772-8E79-3D69D8477DE4
        min-size: 16M
        size: 32M
      - name: ubuntu-data
        role: system-data
        filesystem: ext4
        type: 0FC63DAF-8483-4772-8E79-3D69D8477DE4
        size: 1G

kernel-cmdline:
  # Kernel commandline allow list.
  allow:
    # Enable and use zswap
    # https://docs.kernel.org/admin-guide/mm/zswap.html
    - zswap.enabled=1
    - zswap.compressor=lz4
    - zswap.max_pool_percent=20
    # Disable pressure stall information, turns off kernel resource-pressure
    # accounting.
    - psi=0
    # Enable automatic PCI bridge resource allocation.
    # Optional, covers UEFI implementation gaps.
    # https://www.kernel.org/doc/Documentation/admin-guide/kernel-parameters.txt
    - pci=realloc=on
    # Disable USB suspend. Useful when we have USB peripherals we want to
    # guarantee are available.
    - usbcore.autosuspend=-1
    # Relaxes ACPI resource claiming enforcement; now reservations may overlap.
    - acpi_enforce_resources=lax
    - acpi_backlight=vendor
    # Use the CPU's clocksource directly.
    # https://github.com/torvalds/linux/blob/master/kernel/time/clocksource.c
    # https://docs.kernel.org/admin-guide/kernel-parameters.html
    - clocksource=tsc
    # Blacklists the ACPI P-state driver. Use this when you are using your
    # silicon-specific P-state driver.
    - initcall_blacklist=acpi_cpufreq_init
    # Puts IOMMU into passthrough mode to disable DMA translation for maximum
    # performance. The kernel will judge when this should happen, this option
    # just turns on the possibility.
    - iommu=pt
    # Force IOMMU (AMD-Vi) for DMA protection and device isolation.
    - amd_iommu=on
    # Enables shared memory mode when using the AMD P-state driver.
    - amd_pstate.shared_mem=1
    # Select the guidance mode for the AMD P-state driver.
    - amd_pstate=guided
    # Enable bootcharting on Ubuntu Core.
    - core.bootchart

# Default snap configuration
defaults:
  # landscape-client
  ffnH0sJpX3NFAclH777M8BdXIWpo93af:
    account-name: LANDSCAPE_NAME
    landscape-url: "https://landscape.canonical.com"
    auto-register:
      enabled: true
      computer-title-pattern: ${model}-${serial}
      wait-for-serial-as: true
  # caddy
  zrzDNQtnyUahziRvlXnRX6eRvus25JZk:
    config:
      apps:
        dynamic_dns:
          dns_provider:
            api_key: "PORKBUN_API_KEY"
            api_secret_key: "PORKBUN_API_SECRET_KEY"
            name: "porkbun"
          domains:
            dilyn.cc:
              - "@"
              - "www"
            git.dilyn.cc:
              - "@"
              - "www"
            immich.dilyn.cc:
              - "@"
              - "www"
            jellyfin.dilyn.cc:
              - "@"
              - "www"
            landscape.dilyn.cc:
              - "@"
              - "www"
          ip_sources:
            - endpoints:
                - "https://icanhazip.com"
              source: "simple_http"
            - endpoints:
                - "https://api64.ipify.org"
              source: "simple_http"
          versions: {}
        http:
          servers:
            srv0:
              listen:
                - ":443"
              routes:
                - handle:
                    - handler: "subroute"
                      routes:
                        - handle:
                            - handler: "vars"
                              root: "/var/snap/caddy/common/www/dilyn.cc/docs"
                            - handler: "file_server"
                              hide:
                                - "./Caddyfile"
                  match:
                    - host:
                        - "dilyn.cc"
                  terminal: true
                - handle:
                    - handler: "subroute"
                      routes:
                        - handle:
                            - handler: "reverse_proxy"
                              upstreams:
                                - dial: "localhost:3000"
                  match:
                    - host:
                        - "git.dilyn.cc"
                  terminal: true
                - handle:
                    - handler: "subroute"
                      routes:
                        - handle:
                            - handler: "reverse_proxy"
                              upstreams:
                                - dial: "localhost:3001"
                  match:
                    - host:
                        - "immich.dilyn.cc"
                  terminal: true
                - handle:
                    - handler: "subroute"
                      routes:
                        - handle:
                            - handler: "reverse_proxy"
                              upstreams:
                                - dial: "localhost:8096"
                  match:
                    - host:
                        - "jellyfin.dilyn.cc"
                  terminal: true
        tls:
          automation:
            policies:
              - issuers:
                  - challenges:
                      dns:
                        provider:
                          api_key: "PORKBUN_API_KEY"
                          api_secret_key: "PORKBUN_API_SECRET_KEY"
                          name: "porkbun"
                    module: "acme"
                subjects:
                  - "dilyn.cc"
                  - "git.dilyn.cc"
                  - "immich.dilyn.cc"
                  - "jellyfin.dilyn.cc"
