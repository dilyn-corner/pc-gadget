volumes:
  pc:
    schema: gpt
    # bootloader configuration is shipped and managed by snapd
    bootloader: grub
    structure:
      - name: ubuntu-seed
        role: system-seed
        filesystem: vfat
        # UEFI will boot the ESP partition by default first
        type: C12A7328-F81F-11D2-BA4B-00A0C93EC93B
        # This snap is being used primarily for my NAS, which is seeding almost
        # 10GB of snaps. To allow for remodelling, make this size huge.
        # The root device is a 1TB SSD, we'll be fine.
        size: 30G
        update:
          edition: 1
        content:
          - source: grubx64.efi
            target: EFI/ubuntu/grubx64.efi
          - source: shim.efi.signed
            target: EFI/ubuntu/shimx64.efi
          - source: boot.csv
            target: EFI/ubuntu/bootx64.csv
          - source: fb.efi
            target: EFI/boot/fbx64.efi
          - source: shim.efi.signed
            target: EFI/boot/bootx64.efi
      - name: ubuntu-boot
        role: system-boot
        filesystem: ext4
        type: 0FC63DAF-8483-4772-8E79-3D69D8477DE4
        # Exorbidant size, just-in-case. We shouldn't need this much space, but
        # we have the lattitude anyways.
        size: 5G
        update:
          edition: 1
        content:
          - source: grubx64.efi
            target: EFI/boot/grubx64.efi
      - name: ubuntu-save
        role: system-save
        filesystem: ext4
        type: 0FC63DAF-8483-4772-8E79-3D69D8477DE4
        # Minimum size for FDE - some sources report 16M but be safe.
        min-size: 32M
        # There might be data we wish to save, and I don't know what a good size
        # is for this.
        size: 1G
      - name: ubuntu-data
        role: system-data
        filesystem: ext4
        type: 0FC63DAF-8483-4772-8E79-3D69D8477DE4
        # This will be automatically resized to fill the rest of the disk anyways.
        size: 1M

connections:
