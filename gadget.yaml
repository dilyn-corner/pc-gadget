volumes:
  pc:
    schema: gpt
    # bootloader configuration is shipped and managed by snapd
    bootloader: grub
    structure:
      - name: mbr
        type: mbr
        size: 440
        update:
          edition: 1
        # This mbr simply writes an error to the console, as this
        # gadget supports gpt only
        content:
          - image: mbr.img
        # This one should be removed if we find a way to allow updates
        # without keeping all partitions.
      - name: BIOS Boot
        type: 21686148-6449-6E6F-744E-656564454649
        size: 1M
        offset: 1M
        update:
          edition: 1
      - name: ubuntu-seed
        role: system-seed
        filesystem: vfat
        # UEFI will boot the ESP partition by default first
        type: C12A7328-F81F-11D2-BA4B-00A0C93EC93B
        # It isn't obvious how big the seed might be, but we have plenty of disk
        # space to work with on the target that this is a reasonable default.
        size: 5G
        update:
          edition: 1
        content:
          - source: grubx64.efi
            target: EFI/ubuntu/grubx64.efi
          - source: shim.efi.signed
            target: EFI/ubuntu/shimx64.efi
          - source: boot.csv
            target: EFI/ubuntu/bootx64.csv
          - source: fb.efi
            target: EFI/boot/fbx64.efi
          - source: shim.efi.signed
            target: EFI/boot/bootx64.efi
      - name: ubuntu-boot
        role: system-boot
        filesystem: ext4
        type: 0FC63DAF-8483-4772-8E79-3D69D8477DE4
        # This is more than enough space for the size of the kernels we
        # anticipate having on disk.
        size: 750M
        update:
          edition: 1
        content:
          - source: grubx64.efi
            target: EFI/boot/grubx64.efi
      - name: ubuntu-save
        role: system-save
        filesystem: ext4
        type: 0FC63DAF-8483-4772-8E79-3D69D8477DE4
        min-size: 32M
        # It's unclear if we ever plan on using the save partition but just in
        # case, make it large
        size: 1G
      - name: ubuntu-data
        role: system-data
        filesystem: ext4
        type: 0FC63DAF-8483-4772-8E79-3D69D8477DE4
        size: 1M

defaults:
  ffnH0sJpX3NFAclH777M8BdXIWpo93af:
    account-name: LANDSCAPE_NAME
    landscape-url: "https://landscape.canonical.com"
    auto-register:
      enabled: true
      computer-title-pattern: ${model}-${serial}
      wait-for-serial-as: true
  zrzDNQtnyUahziRvlXnRX6eRvus25JZk:
    config:
      apps:
        dynamic_dns:
          dns_provider:
            api_key: "PORKBUN_API_KEY"
            api_secret_key: "PORKBUN_API_SECRET_KEY"
            name: "porkbun"
          domains:
            dilyn.cc:
              - "@"
              - "www"
            git.dilyn.cc:
              - "@"
              - "www"
            immich.dilyn.cc:
              - "@"
              - "www"
            jellyfin.dilyn.cc:
              - "@"
              - "www"
            landscape.dilyn.cc:
              - "@"
              - "www"
          ip_sources:
            - endpoints:
                - "https://icanhazip.com"
              source: "simple_http"
            - endpoints:
                - "https://api64.ipify.org"
              source: "simple_http"
          versions: {}
        http:
          servers:
            srv0:
              listen:
                - ":443"
              routes:
                - handle:
                    - handler: "subroute"
                      routes:
                        - handle:
                            - handler: "vars"
                              root: "/var/snap/caddy/common/www/dilyn.cc/docs"
                            - handler: "file_server"
                              hide:
                                - "./Caddyfile"
                  match:
                    - host:
                        - "dilyn.cc"
                  terminal: true
                - handle:
                    - handler: "subroute"
                      routes:
                        - handle:
                            - handler: "reverse_proxy"
                              upstreams:
                                - dial: "localhost:3000"
                  match:
                    - host:
                        - "git.dilyn.cc"
                  terminal: true
                - handle:
                    - handler: "subroute"
                      routes:
                        - handle:
                            - handler: "reverse_proxy"
                              upstreams:
                                - dial: "localhost:3001"
                  match:
                    - host:
                        - "immich.dilyn.cc"
                  terminal: true
                - handle:
                    - handler: "subroute"
                      routes:
                        - handle:
                            - handler: "reverse_proxy"
                              upstreams:
                                - dial: "localhost:8096"
                  match:
                    - host:
                        - "jellyfin.dilyn.cc"
                  terminal: true
        tls:
          automation:
            policies:
              - issuers:
                  - challenges:
                      dns:
                        provider:
                          api_key: "PORKBUN_API_KEY"
                          api_secret_key: "PORKBUN_API_SECRET_KEY"
                          name: "porkbun"
                    module: "acme"
                subjects:
                  - "dilyn.cc"
                  - "git.dilyn.cc"
                  - "immich.dilyn.cc"
                  - "jellyfin.dilyn.cc"
    modified: false
