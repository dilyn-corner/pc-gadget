# Some optimal commandline flags for AMD and other choices
kernel-cmdline:
  # Kernel commandline allow list.
  allow:
    # Enable and use zswap
    # https://docs.kernel.org/admin-guide/mm/zswap.html
    - zswap.enabled=*
    - zswap.compressor=*
    - zswap.max_pool_percent=*
    # Disable pressure stall information, turns off kernel resource-pressure
    # accounting.
    - psi=*
    # Enable automatic PCI bridge resource allocation.
    # Optional, covers UEFI implementation gaps.
    # https://www.kernel.org/doc/Documentation/admin-guide/kernel-parameters.txt
    - pci="realloc=*"
    # Disable USB suspend. Useful when we have USB peripherals we want to
    # guarantee are available.
    - usbcore.autosuspend=*
    # Relaxes ACPI resource claiming enforcement; now reservations may overlap.
    - acpi_enforce_resources=*
    - acpi_backlight=*
    # Use the CPU's clocksource directly.
    # https://github.com/torvalds/linux/blob/master/kernel/time/clocksource.c
    # https://docs.kernel.org/admin-guide/kernel-parameters.html
    - clocksource=*
    # Blacklists the ACPI P-state driver. Use this when you are using your
    # silicon-specific P-state driver.
    - initcall_blacklist=*
    # Puts IOMMU into passthrough mode to disable DMA translation for maximum
    # performance. The kernel will judge when this should happen, this option
    # just turns on the possibility.
    - iommu=*
    # Force IOMMU (AMD-Vi) for DMA protection and device isolation.
    - amd_iommu=*
    # Enables shared memory mode when using the AMD P-state driver.
    - amd_pstate.shared_mem=*
    # Select the guidance mode for the AMD P-state driver.
    - amd_pstate=*
    # Enable bootcharting on Ubuntu Core.
    - core.bootchart
  append:
    - zswap.enabled=1
    - zswap.compressor=lz4
    - zswap.max_pool_percent=20
    - psi=0
    - pci=realloc=on
    - usbcore.autosuspend=-1
    - acpi_enforce_resources=lax
    - acpi_backlight=vendor
    - clocksource=tsc
    - initcall_blacklist=acpi_cpufreq_init
    - iommu=pt
    - amd_iommu=on
    - amd_pstate.shared_mem=1
    - amd_pstate=guided
    - core.bootchart

# Default snap configuration
defaults:
  # landscape-client
  ffnH0sJpX3NFAclH777M8BdXIWpo93af:
    account-name: LANDSCAPE_NAME
    landscape-url: "https://landscape.canonical.com"
    auto-register:
      enabled: true
      computer-title-pattern: ${model}-${serial}
      wait-for-serial-as: true
  # caddy
  zrzDNQtnyUahziRvlXnRX6eRvus25JZk:
    config:
      apps:
        dynamic_dns:
          dns_provider:
            api_key: "PORKBUN_API_KEY"
            api_secret_key: "PORKBUN_API_SECRET_KEY"
            name: "porkbun"
          domains:
            dilyn.cc:
              - "@"
              - "www"
            git.dilyn.cc:
              - "@"
              - "www"
            immich.dilyn.cc:
              - "@"
              - "www"
            jellyfin.dilyn.cc:
              - "@"
              - "www"
            landscape.dilyn.cc:
              - "@"
              - "www"
          ip_sources:
            - endpoints:
                - "https://icanhazip.com"
              source: "simple_http"
            - endpoints:
                - "https://api64.ipify.org"
              source: "simple_http"
          versions: {}
        http:
          servers:
            srv0:
              listen:
                - ":443"
              routes:
                - handle:
                    - handler: "subroute"
                      routes:
                        - handle:
                            - handler: "vars"
                              root: "/var/snap/caddy/common/www/dilyn.cc/docs"
                            - handler: "file_server"
                              hide:
                                - "./Caddyfile"
                  match:
                    - host:
                        - "dilyn.cc"
                  terminal: true
                - handle:
                    - handler: "subroute"
                      routes:
                        - handle:
                            - handler: "reverse_proxy"
                              upstreams:
                                - dial: "localhost:3000"
                  match:
                    - host:
                        - "git.dilyn.cc"
                  terminal: true
                - handle:
                    - handler: "subroute"
                      routes:
                        - handle:
                            - handler: "reverse_proxy"
                              upstreams:
                                - dial: "localhost:3001"
                  match:
                    - host:
                        - "immich.dilyn.cc"
                  terminal: true
                - handle:
                    - handler: "subroute"
                      routes:
                        - handle:
                            - handler: "reverse_proxy"
                              upstreams:
                                - dial: "localhost:8096"
                  match:
                    - host:
                        - "jellyfin.dilyn.cc"
                  terminal: true
        tls:
          automation:
            policies:
              - issuers:
                  - challenges:
                      dns:
                        provider:
                          api_key: "PORKBUN_API_KEY"
                          api_secret_key: "PORKBUN_API_SECRET_KEY"
                          name: "porkbun"
                    module: "acme"
                subjects:
                  - "dilyn.cc"
                  - "git.dilyn.cc"
                  - "immich.dilyn.cc"
                  - "jellyfin.dilyn.cc"
